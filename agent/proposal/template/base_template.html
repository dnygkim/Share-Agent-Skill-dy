<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{사업명} 제안서</title>
<style>
/* ============================================================================
   슬라이드형 골격 (1280×720 덱)
   스타일 정본 : ../../../global-house-style/house-style.css §1 서체 · §2 토큰
                 (= ~/.claude/house-style/house-style.css)
   토큰 사본   : ./slide-tokens.css  ← 아래 :root 는 그 파일과 같은 값이다

   ★ 산출물은 자기완결(single file)이어야 하므로 외부 .css 를 link 하지 않고
     토큰을 여기 인라인한다. 값을 바꿀 일이 생기면 정본을 먼저 고친다.
   ★ 기본값 = house 토큰(warm paper + near-black ink). 클라이언트 CI 컬러는
     **명시적으로 요청받았을 때만** slide-tokens.css 의 [CI 오버라이드] 블록을
     이 :root 뒤에 덧붙여 얹는다. 묻지 않고 임의로 켜지 않는다.
   ============================================================================ */
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css');
@font-face{font-family:'Paperlogy';font-style:normal;font-weight:400;font-display:swap;
  src:local('Paperlogy 4Regular'),local('Paperlogy-4Regular'),
      url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2');}
@font-face{font-family:'Paperlogy';font-style:normal;font-weight:600;font-display:swap;
  src:local('Paperlogy 6SemiBold'),local('Paperlogy-6SemiBold'),
      url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2');}
@font-face{font-family:'Paperlogy';font-style:normal;font-weight:800;font-display:swap;
  src:local('Paperlogy 8ExtraBold'),local('Paperlogy-8ExtraBold'),
      url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2');}
@font-face{font-family:'Paperlogy';font-style:normal;font-weight:900;font-display:swap;
  src:local('Paperlogy 9Black'),local('Paperlogy-9Black'),
      url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-9Black.woff2') format('woff2');}

  :root{
    --paper:#F1EDE5; --paper-2:#E8E3D9; --surface:#FFFFFF;
    --ink:#14130F;   --ink-2:#56534C;   --ink-3:#8C887F;
    --line:#D9D3C7;  --line-2:#E6E1D7;  --warn:#7A4A2C;
    --font-title:'Paperlogy','Pretendard Variable','Pretendard','Malgun Gothic',sans-serif;
    --font-body:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,system-ui,
                'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;

    /* 덱이 쓰는 이름 → house 토큰 (기본값). 강조는 색이 아니라 반전·명도·굵기다. */
    --ci-main:var(--ink);       /* 헤더바·표 헤더·강조 박스 = 반전 블록 */
    --ci-point:var(--ink);      /* 강조선·뱃지·핵심수치 */
    --ci-sub:var(--ink-2);      /* 서브 테두리·아이콘 */
    --ci-bg:var(--paper);       /* 슬라이드 배경 */
    --ci-subbg:var(--surface);  /* 카드 배경·교대행 */
    --text:var(--ink); --text-sub:var(--ink-2); --text-inv:var(--paper);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--ink);font-family:var(--font-body);color:var(--text);
    letter-spacing:-.003em;-webkit-font-smoothing:antialiased}
  /* 1슬라이드 = 1280x720 고정비율 */
  .slide{position:relative;width:1280px;height:720px;margin:24px auto;background:var(--ci-bg);
    overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,.35)}
  /* 헤더바 = 반전 블록. 하단 4px 은 CI 강조선 자리 —
     기본값(ci-point = ink)에서는 헤더에 묻히고, CI 를 얹으면 강조선으로 드러난다. */
  .slide-header{height:58px;background:var(--ci-main);color:var(--text-inv);
    display:flex;justify-content:space-between;align-items:center;padding:0 40px;
    border-bottom:4px solid var(--ci-point)}
  .slide-header .proj{font-family:var(--font-title);font-weight:700;font-size:16px;letter-spacing:.02em}
  .slide-header .sect{font-size:14px;opacity:.82}
  .slide-body{padding:40px 48px}
  .slide-title{font-family:var(--font-title);font-weight:800;font-size:30px;
    letter-spacing:-.025em;margin-bottom:8px}
  /* 키워드 강조 — 기본값에서는 굵기로, CI 를 얹으면 색으로 드러난다 */
  .slide-title .key{color:var(--ci-point);font-weight:900}
  .slide-desc{font-size:15px;color:var(--text-sub);margin-bottom:24px;line-height:1.7}
  .slide-footer{position:absolute;bottom:18px;left:48px;right:48px;
    display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
  /* 카드형 — house 는 각진 모서리 + 1px 테두리다 */
  .cards{display:flex;gap:20px}
  .card{flex:1;background:var(--ci-subbg);border:1px solid var(--line);border-radius:0;padding:24px}
  .card .kp{border-left:3px solid var(--ci-point);padding-left:12px;margin-top:14px;
    font-family:var(--font-title);font-weight:700}
  /* 표형 */
  table{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
  th{background:var(--ci-main);color:var(--text-inv);padding:10px;text-align:left;
    font-family:var(--font-title);font-weight:600}
  td{padding:10px;border-bottom:1px solid var(--line-2)}
  tr:nth-child(even) td{background:var(--ci-subbg)}
  /* 인쇄(PDF) — 1슬라이드 1페이지 */
  @media print{
    body{background:#fff}
    .slide{margin:0;box-shadow:none;page-break-after:always;
      -webkit-print-color-adjust:exact;print-color-adjust:exact}
    @page{size:1280px 720px;margin:0}
  }
</style>
</head>
<body>

<!-- ===== 슬라이드 템플릿 (복제해 사용) ===== -->
<section class="slide">
  <div class="slide-header">
    <span class="proj">{사업명}</span>
    <span class="sect">Project Overview</span>
  </div>
  <div class="slide-body">
    <h1 class="slide-title">슬라이드 <span class="key">대제목</span></h1>
    <p class="slide-desc">설명문 1-2줄.</p>
    <div class="cards">
      <div class="card"><h3>카드 1</h3><p>내용</p><div class="kp">Key Point</div></div>
      <div class="card"><h3>카드 2</h3><p>내용</p><div class="kp">Key Point</div></div>
      <div class="card"><h3>카드 3</h3><p>내용</p><div class="kp">Key Point</div></div>
    </div>
  </div>
  <div class="slide-footer"><span>{클라이언트명} × {수주사명}</span><span>1</span></div>
</section>

</body>
</html>
