display_information:
  name: my-bot
  description: 채널 자동 알림 · 멘션 질문 답변
features:
  bot_user:
    display_name: my-bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - incoming-webhook
      - chat:write
      - app_mentions:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
