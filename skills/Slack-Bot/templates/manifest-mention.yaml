display_information:
  name: my-bot
  description: 채널 자동 알림 · 멘션 질문 답변
features:
  bot_user:
    display_name: my-bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - incoming-webhook
      - chat:write
      - app_mentions:read
      - channels:history   # 스레드 맥락(공개 채널) — 비공개 채널도 쓰면 groups:history 추가
      - users:read         # 이름으로 전달 대상 지정 · 스레드 화자 이름
settings:
  event_subscriptions:
    bot_events:
      - app_mention
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
